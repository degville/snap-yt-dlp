name: yt-dlp
summary: A fork of youtube-dl with additional features and patches 
description: |
      Based on youtube-dl 2021.06.06 commit/379f52a and 
      youtube-dlc 2020.11.11-3 commit/98e248f, youtube-dl offers all the
      features and patches of youtube-dlc in addition to the latest youtube-dl
adopt-info: yt-dlp
grade: stable 
confinement: strict
base: core24
platforms:
  amd64:
  arm64:

apps:
  yt-dlp:
    command: bin/yt-dlp
    command-chain: [bin/setup-env.sh]
    plugs: [home, network, network-bind, removable-media]
    environment:
      PATH: "$SNAP/usr/bin:$SNAP/bin:$PATH"
      PYTHONPATH: "$SNAP/usr/lib/python3/dist-packages:$SNAP_DESKTOP_RUNTIME/usr/lib/python3.12/site-packages:$PYTHONPATH"
parts:
  yt-dlp:
    plugin: python
    source: https://github.com/yt-dlp/yt-dlp.git
    #source-tag: '2023.10.13'
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags)
    stage-packages:
      - libavdevice60
      - libblas3
      - ffmpeg
      - libpulse0
      - python3-certifi
      - python3-mutagen
    organize:
      usr/bin/ffmpeg: bin/ffmpeg
      usr/bin/ffprobe: bin/ffprobe
  env-setup:
    plugin: dump
    source: snap/local
    organize:
      setup-env.sh: bin/setup-env.sh
  deno:
    plugin: rust
    source: https://github.com/denoland/deno/archive/refs/tags/v2.6.3.tar.gz
    source-type: tar
    override-build: |
      cargo build --locked --release
      install -Dm755 ./target/release/deno "$SNAPCRAFT_PART_INSTALL/bin/deno"
    build-packages:
    - cmake
    - clang
    - libclang-dev
